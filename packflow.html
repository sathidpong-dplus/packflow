function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const c=document.createElement('div');c.className='conf';const em=['🎉','⭐','✨','📦','🟢','🏆'];for(let i=0;i<26;i++){const s=document.createElement('span');s.textContent=em[i%em.length];s.style.left=Math.random()*100+'%';s.style.animationDelay=Math.random()*.7+'s';c.appendChild(s)}document.body.appendChild(c);setTimeout(()=>c.remove(),3800)}
const mScore=(st,pph,cost)=>Math.round(st*100+pph/2+Math.max(0,12-cost)*10);
function totalScore(){let t=0;[1,2,3].forEach(l=>{if(P.best&&P.best[l])t+=P.best[l].score});return t+((P.arc&&P.arc.best)||0)}
let DBc=null,USERc=null,LB=[];
function recordBest(l,d){
  P.best=P.best||{};const cost=d.uc.tot,sc=mScore(d.st,d.pph,cost),old=P.best[l];
  if(!old||sc>old.score){P.best[l]={score:sc,pph:Math.round(d.pph),cost:Math.round(cost*100)/100,st:d.st,ct:d.ct,lab:d.uc.lab,mat:d.uc.mat,inv:d.uc.inv,people:d.people,rate:d.rate,invest:d.invest||0};saveP();submitScore();return true}return false;
}
async function submitScore(){
  if(!DBc||!USERc||!P.nick)return;
  try{const uid=await USERc.id();if(!uid)return;const b=P.best||{};
   const g=(l,k)=>(b[l]&&b[l][k])||0;await DBc.doc('pfscores/'+uid).set({name:P.nick,tid:P.team?slug(P.team):'',total:totalScore(),s1:g(1,'pph'),s2:g(2,'pph'),s3:g(3,'pph'),st1:g(1,'st'),st2:g(2,'st'),st3:g(3,'st'),c1:g(1,'cost'),c2:g(2,'cost'),c3:g(3,'cost'),arc:(P.arc&&P.arc.best)||0,mt:(P.mt&&P.mt.d)||'',s3d:P.s3||{},vot:P.votesN||0,t:Date.now()})}catch(e){}
}
function boardHTML(){
  const mine=[{id:'me',name:(P.nick||'คุณ')+' (เครื่องนี้)',total:totalScore(),s1:(P.best&&P.best[1]&&P.best[1].pph)||0,s2:(P.best&&P.best[2]&&P.best[2].pph)||0,s3:(P.best&&P.best[3]&&P.best[3].pph)||0,arc:(P.arc&&P.arc.best)||0}];
  const rows=(DBc?LB.slice():mine).filter(r=>r.total>0||!DBc).sort((a,b)=>b.total-a.total).slice(0,15);

  return `<div class="lbd" style="display:flex;flex-direction:column;gap:8px">${rows.length?rows.map((r,i)=>`<div class="rk ${r.name===P.nick?'me':''}"><b>${medal[i]||(i+1)}</b><span style="min-width:0;overflow-wrap:anywhere"><b>${esc(r.name||'ไม่ระบุชื่อ')}</b><br><span class="sm">ด่าน1 ${fmt(r.s1||0)} · ด่าน2 ${fmt(r.s2||0)} · ด่าน3 ${fmt(r.s3||0)} ชิ้น/ชม. · แข่งแพ็ค ${fmt(r.arc||0)}</span></span><b>${fmt(r.total)} แต้ม</b></div>`).join(''):'<span class="sm mut">ยังไม่มีผู้เล่นบนกระดาน เป็นคนแรกเลย</span>'}</div><p class="sm mut">${DBc?'อันดับรวมของทุกคนที่ใส่ชื่อเล่น (อัปเดตสดเมื่อมีคนทำคะแนนใหม่)':'ตอนนี้แสดงเฉพาะคะแนนบนเครื่องนี้ (ระบบอันดับรวมใช้ไม่ได้ในมุมมองนี้)'}</p>`;

function arcNewRound(){AR.pos=0;AR.t=ARC_T;AR.boxes=0;AR.err=0;AR.bad=0}
function arcStart(){AR={r:0,total:0,res:[],between:false};arcNewRound();clearInterval(arTimer);arTimer=setInterval(arcTick,250);viewArcade()}
function arcTick(){if(!AR||AR.done)return;AR.t-=.25;const t=$('arT'),n=$('arN');if(t)t.style.width=Math.max(0,AR.t/ARC_T*100)+'%';if(n)n.textContent=Math.max(0,Math.ceil(AR.t))+' วิ';if(AR.t<=0)arcEndRound()}
function arcEndRound(){
  const R=ROUNDS[AR.r],sc=Math.max(0,Math.round((AR.boxes*20-AR.err*3)*R.mult));AR.res.push({boxes:AR.boxes,err:AR.err,sc});AR.total+=sc;

const estMs=t=>Math.max(1500,ttsClean(t).length*95/(P.vrate||.85));
async function speakTh(t){const rate=P.vrate||.85,c=ttsClean(t);if(!c)return;if(P.mute){await sleep(estMs(t));return}if((P.voice==='device'||!TTSc)&&hasDev()){await devSpeak(c,rate);return}if(!TTSc){await sleep(estMs(t));return}try{await TTSc.speak(c,{language:'th',rate,voice:P.voice||'buttery'})}catch(e){await sleep(Math.min(estMs(t),2500))}}

function devSpeak(c,rate){return new Promise(r=>{try{spUnlock();if(speechSynthesis.paused)try{speechSynthesis.resume()}catch(e){}const u=new SpeechSynthesisUtterance(c);u.lang='th-TH';u.rate=rate;const v=speechSynthesis.getVoices().find(x=>/^th/i.test(x.lang));if(v)u.voice=v;let done=false;const fin=()=>{if(!done){done=true;r()}};u.onend=fin;u.onerror=fin;setTimeout(fin,Math.max(4000,c.length*220));speechSynthesis.speak(u)}catch(e){r()}})}
const hasDev=()=>typeof speechSynthesis!=='undefined'&&typeof SpeechSynthesisUtterance!=='undefined';
let SPUNLOCKED=false;
function spUnlock(){
  if(SPUNLOCKED||!hasDev())return;SPUNLOCKED=true;
  try{const u=new SpeechSynthesisUtterance('เริ่ม');u.volume=0;u.lang='th-TH';u.rate=1.4;speechSynthesis.speak(u)}catch(e){}
  try{speechSynthesis.getVoices()}catch(e){}
}
document.addEventListener('pointerdown',spUnlock,true);

async function vidPlay(){
  const tok=++VID.tok;VID.playing=true;VID.t0=Date.now();const sub=t=>{const e=$('vsub');if(e)e.textContent=t},btn=()=>{const b=document.querySelector('[data-act=vplay]');if(b)b.textContent=VID.playing?'⏸ หยุดชั่วคราว':'▶ เล่น'};btn();
  const GL=vidList(),LV=VID.mode==='lv';
  for(let i=VID.i;i<GL.length;i++){
    if((VID.tok!==tok||V.view!=='vid'))return;if(VID.i!==i||VID.recap){VID.i=i;VID.recap=false;vidRender();btn()}
    VID.done=GL.slice(0,i).reduce((n,x)=>n+1+x.tips.length,0)+i;const g=GL[i],lines=[(LV?'':'ขั้นที่ '+(i+1)+' ')+g.t].concat(g.tips);
    for(const l of lines){if((VID.tok!==tok||V.view!=='vid'))return;sub(l);await speakTh(l);if((VID.tok!==tok||V.view!=='vid'))return;VID.done++;await sleep(500)}
    await sleep(600);
  }
  if((VID.tok!==tok||V.view!=='vid'))return;VID.recap=true;vidRender();btn();
  const items=GL.map((g,i)=>(LV?'':'ขั้นที่ '+(i+1)+' ')+g.t);
  const sub2=t=>{const e=$('vsub');if(e)e.textContent=t};sub2('มาทบทวนกัน');await speakTh('มาทบทวนกัน');
  for(let i=0;i<items.length;i++){if((VID.tok!==tok||V.view!=='vid'))return;const c=$('rc'+i);if(c){c.style.opacity=1;c.style.borderColor='var(--accent)'}sub2(items[i]);await speakTh(items[i]);VID.done++;await sleep(400)}
  if((VID.tok!==tok||V.view!=='vid'))return;{const e=LV?'จบวิดีโอ พร้อมแล้ว เริ่มด่านหนึ่งได้เลย':'จบวิดีโอ ทำตามขั้นตอนทีละขั้น ตรวจให้ครบ แล้วเริ่มด่านหนึ่งได้เลย';sub2(e);await speakTh(e)};VID.acc+=Date.now()-VID.t0;VID.playing=false;VID.done=vidTotal();btn();vclockTick();
}
